name: Overture import

# Manual only. Always run a dry run first and review the report before a load.
on:
  workflow_dispatch:
    inputs:
      job:
        description: "migrate = apply missing database migrations (run with mode load before any data job); import = one cluster; national = ZIP counts + location lookup; matches = generate a metro's matches"
        required: true
        type: choice
        options: [migrate, import, national, matches]
        default: import
      cluster:
        description: "default = us-weddings for import, dfw-weddings for matches. Matches need a metro (not us-weddings). Leave as default for migrate and national."
        required: true
        type: choice
        options: [default, us-weddings, dfw-weddings, atl-weddings, hou-weddings, phx-weddings, bna-weddings]
        default: default
      mode:
        description: "dry-run reports what would change; load writes (not used by matches)"
        required: true
        type: choice
        options: [dry-run, load]
        default: dry-run
      release:
        description: "Overture release (blank = latest)"
        required: false

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: scripts/overture
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/overture/requirements.txt
      # Before installing anything or touching the database: is this job/cluster pair valid?
      - name: Check inputs
        id: inputs
        env:
          JOB: ${{ inputs.job }}
          CLUSTER: ${{ inputs.cluster }}
        run: |
          if ! cluster=$(python -m sc_overture check-inputs --job "$JOB" --cluster "$CLUSTER" 2> error.txt); then
            cat error.txt | tee -a "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "cluster=$cluster" >> "$GITHUB_OUTPUT"
          echo "Job $JOB${cluster:+, cluster $cluster}" >> "$GITHUB_STEP_SUMMARY"
      - run: pip install -r requirements.txt
      - run: python -m pytest -q
      - name: Run
        shell: bash
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          JOB: ${{ inputs.job }}
          CLUSTER: ${{ steps.inputs.outputs.cluster }}
          MODE: ${{ inputs.mode }}
          RELEASE: ${{ inputs.release }}
        run: |
          set -o pipefail
          status=0
          {
            # Seeding needs the tables, so migrate runs on its own. If seeding fails
            # (for example, migrations still pending), stop before the job itself.
            [ "$JOB" = migrate ] || python -m sc_overture seed || exit 1
            case "$JOB" in
              migrate)  python -m sc_overture migrate $([ "$MODE" = dry-run ] && echo --dry-run) ;;
              import)   python -m sc_overture import "$CLUSTER" "--$MODE" ${RELEASE:+--release "$RELEASE"} ;;
              national) python -m sc_overture national "--$MODE" ${RELEASE:+--release "$RELEASE"} ;;
              matches)  python -m sc_overture matches "$CLUSTER" ;;
            esac
          } 2>&1 | tee report.txt || status=$?
          { echo '```'; cat report.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          exit $status
