name: Overture import

# Manual only. Always run a dry run first and review the report before a load.
on:
  workflow_dispatch:
    inputs:
      job:
        description: "import = one cluster; national = ZIP counts + location lookup; matches = generate a metro's matches"
        required: true
        type: choice
        options: [import, national, matches]
        default: import
      cluster:
        description: "Cluster slug (us-weddings, dfw-weddings…); not used by national"
        required: false
        default: us-weddings
      mode:
        description: "dry-run reports counts and projected size; load writes (import and national only)"
        required: true
        type: choice
        options: [dry-run, load]
        default: dry-run
      release:
        description: "Overture release (blank = latest)"
        required: false

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: scripts/overture
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/overture/requirements.txt
      - run: pip install -r requirements.txt
      - run: python -m pytest -q
      - name: Run
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          JOB: ${{ inputs.job }}
          CLUSTER: ${{ inputs.cluster }}
          MODE: ${{ inputs.mode }}
          RELEASE: ${{ inputs.release }}
        run: |
          python -m sc_overture seed
          case "$JOB" in
            import)   python -m sc_overture import "$CLUSTER" "--$MODE" ${RELEASE:+--release "$RELEASE"} | tee report.txt ;;
            national) python -m sc_overture national "--$MODE" ${RELEASE:+--release "$RELEASE"} | tee report.txt ;;
            matches)  python -m sc_overture matches "$CLUSTER" | tee report.txt ;;
          esac
          { echo '```'; cat report.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
